<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giovanni Alfadiansyah — Software Engineer & Full Stack Developer</title>
    <meta name="description" content="Portfolio of Giovanni Alfadiansyah - Software Engineer & Technical Consultant specializing in Java 21, Spring Boot, BSSN Cybersecurity LMS, Bank Mega Modernization, and Odoo ERP." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Anti-Watermark CSS -->
    <style>
      #spline-watermark,
      #logo,
      a[href*="spline.design"],
      [data-spline-watermark],
      [class*="spline-watermark"],
      [id*="spline-watermark"],
      [class*="watermark"],
      [id*="watermark"],
      spline-viewer::part(logo),
      spline-viewer #logo,
      #hero a[href*="spline"] {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        z-index: -9999 !important;
      }
    </style>

    <!-- Global Watermark Stripper for Shadow DOM & Canvas Container -->
    <script>
      (function() {
        function removeSplineBadge() {
          try {
            // Standard DOM
            document.querySelectorAll('a[href*="spline.design"], #spline-watermark, #logo, [class*="watermark"], [id*="watermark"], [data-spline-watermark]').forEach(function(el) {
              el.style.display = 'none';
              el.remove();
            });
            // Shadow DOM
            document.querySelectorAll('*').forEach(function(node) {
              if (node.shadowRoot) {
                var badge = node.shadowRoot.querySelector('#logo, a[href*="spline.design"], #spline-watermark, [class*="watermark"], [id*="watermark"]');
                if (badge) {
                  badge.style.display = 'none';
                  badge.remove();
                }
              }
            });
          } catch(e) {}
        }
        setInterval(removeSplineBadge, 50);
        window.addEventListener('DOMContentLoaded', removeSplineBadge);
        window.addEventListener('load', removeSplineBadge);
      })();
    </script>
  </head>
  <body class="bg-sand-100 dark:bg-charcoal-950 text-charcoal-900 dark:text-sand-100 font-sans antialiased selection:bg-gold-400 selection:text-charcoal-950 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
